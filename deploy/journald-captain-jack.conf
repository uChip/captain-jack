# Installed as /etc/systemd/journald.conf.d/50-captain-jack.conf by
# deploy/install.sh. Raspberry Pi OS keeps the journal in RAM only
# (40-rpi-volatile-storage.conf); Jack's transcripts are kept 7 days
# on the SD card for debugging (CLAUDE.md item 11), size-capped. journald
# batches writes (SyncIntervalSec, 5 min by default), keeping SD wear down.
[Journal]
Storage=persistent
MaxRetentionSec=7day
SystemMaxUse=200M
